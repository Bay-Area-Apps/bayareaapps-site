name: BayAreaApps
options:
  bundleIdPrefix: com.bayareaapps
  deploymentTarget:
    iOS: '18.0'
    macOS: '15.0'
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: '1.0'
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
packages:
  BayAreaCore:
    path: .
targets:
  BayAreaAppsIOS:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: BayAreaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bayareaapps.StudioCompanion
        PRODUCT_NAME: Bay Area Apps
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Bay Area Apps
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        SUPPORTS_MACCATALYST: NO
  BayAreaAppsMac:
    type: application
    platform: macOS
    sources: [App]
    dependencies:
      - package: BayAreaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bayareaapps.StudioCompanion.mac
        PRODUCT_NAME: Bay Area Apps
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Bay Area Apps
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_ENTITLEMENTS: App/BayAreaAppsMac.entitlements
schemes:
  BayAreaAppsIOS:
    build:
      targets:
        BayAreaAppsIOS: all
  BayAreaAppsMac:
    build:
      targets:
        BayAreaAppsMac: all
